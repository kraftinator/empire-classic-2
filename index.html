  }
});
document.getElementById('bar-home').addEventListener('click', () => {
  const unit = getCurrentUnit();
  if (unit) {
    unit.orders = 'goHome';
    executeGoHome(unit);
    afterMove(unit);
  }
});
document.getElementById('bar-wake').addEventListener('click', doWake);
document.getElementById('bar-prod').addEventListener('click', doProd);
document.getElementById('bar-unload').addEventListener('click', () => {
  const unit = getCurrentUnit();
  if (!unit || unit.cargo.length === 0) return;

  if (unit.type === 'carrier') {
    // Launch one fighter from carrier
    const fighter = unit.cargo.shift();
    fighter.sentry = false;
    fighter.orders = null;
    fighter.moved = false;
    fighter.movesLeft = getEffectiveSpeed(fighter);
    // Fighter stays on same tile, ready to move
    updateFog();
    render();
  } else if (unit.type === 'transport') {
    // Wake all armies for unloading — they'll be movable when transport moves adjacent to land
    for (const c of unit.cargo) {
      c.sentry = false;
      c.orders = null;
    }
    queueNotification(`${unit.cargo.length} armies ready. Move transport adjacent to land to unload.`);
  }
});
document.getElementById('bar-stats').addEventListener('click', () => {
  const factions = [
    { name: 'You (White)', f: FACTION.P1 },
    { name: 'Red AI', f: FACTION.P2 },
    { name: 'Yellow AI', f: FACTION.P3 },
  ];
  let msg = '';
  for (const { name, f } of factions) {
    const cities = G.cities.filter(c => c.faction === f).length;
    const units = G.units.filter(u => u.faction === f && !isInCargo(u));
    const counts = {};
    for (const u of units) {
      const n = UNIT_DEF[u.type].name;
      counts[n] = (counts[n] || 0) + 1;
    }
    const unitStr = Object.entries(counts).map(([n, c]) => `${n}: ${c}`).join(', ') || 'none';
    msg += `${name}\nCities: ${cities}  Units: ${units.length}\n${unitStr}\n\n`;
  }
  const neutral = G.cities.filter(c => c.faction === FACTION.NONE).length;
  msg += `Neutral cities: ${neutral}`;
  queueNotification(msg);
});

// ============================================================
// 15. SAVE / LOAD
// ============================================================

const SAVE_SLOTS = 5;
const SAVE_KEY = 'empire-classic-2-saves';

function getSaves() {
  try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; }
  catch { return {}; }
}

function openSlotModal(mode) {
  const overlay = document.getElementById('save-overlay');
  const title = document.getElementById('save-title');
  const slotsDiv = document.getElementById('save-slots');
  title.textContent = mode === 'save' ? 'Save Game' : 'Load Game';
  slotsDiv.innerHTML = '';

  const saves = getSaves();
  for (let i = 1; i <= SAVE_SLOTS; i++) {
    const slot = saves['slot' + i];
    const btn = document.createElement('button');
    btn.style.cssText = 'display:block; width:100%; margin:4px 0; padding:8px; background:#333; color:#fff; border:1px solid #666; font-family:Courier New,monospace; font-size:13px; cursor:pointer; text-align:left;';
    if (slot) {
      btn.textContent = `Slot ${i}: Turn ${slot.turn} — ${slot.date}`;
    } else {
      btn.textContent = `Slot ${i}: Empty`;
    }
    btn.addEventListener('click', () => {
      if (mode === 'save') {
        const saves = getSaves();
        saves['slot' + i] = {
          turn: G.turn,
          date: new Date().toLocaleDateString(),
          state: JSON.stringify(G),
        };
        localStorage.setItem(SAVE_KEY, JSON.stringify(saves));
        overlay.style.display = 'none';
        queueNotification(`Game saved to Slot ${i}.`);
      } else {
        if (!slot) { queueNotification('Empty slot.'); return; }
        const restored = JSON.parse(slot.state);
        Object.assign(G, restored);
        updateFog();
        overlay.style.display = 'none';
        render();
        queueNotification(`Game loaded from Slot ${i}.`);
      }
    });
    slotsDiv.appendChild(btn);
  }
  overlay.style.display = 'flex';
}

document.getElementById('bar-save').addEventListener('click', () => openSlotModal('save'));
document.getElementById('bar-load').addEventListener('click', () => openSlotModal('load'));
document.getElementById('save-cancel').addEventListener('click', () => {
  document.getElementById('save-overlay').style.display = 'none';
});

// ============================================================
// 16. NOTIFICATIONS
// ============================================================

let notifQueue = [];

function queueNotification(msg) {
  notifQueue.push(msg);
  if (!document.getElementById('notification').classList.contains('active')) {
    showNextNotification();
  }
}

function showNextNotification() {
  if (notifQueue.length === 0) return;
  const msg = notifQueue.shift();
  document.getElementById('notif-text').textContent = msg;
  document.getElementById('notification').classList.add('active');
}

document.getElementById('notif-ok').addEventListener('click', () => {
  document.getElementById('notification').classList.remove('active');
  if (notifQueue.length > 0) showNextNotification();
});

// Combat log
let combatLogQueue = [];
let combatLogShowing = false;

function showCombatLog(msg, playerWon) {
  combatLogQueue.push({ msg, playerWon });
  if (!combatLogShowing) drainCombatLog();
}

function drainCombatLog() {
  if (combatLogQueue.length === 0) {
    combatLogShowing = false;
    document.getElementById('combat-log').className = '';
    return;
  }
  combatLogShowing = true;
  const { msg, playerWon } = combatLogQueue.shift();
  const el = document.getElementById('combat-log');
  el.textContent = msg;
  el.style.borderColor = playerWon ? '#00aa00' : '#aa0000';
  el.style.color = playerWon ? '#55ff55' : '#ff5555';
  el.className = 'active';
  render();
  setTimeout(drainCombatLog, 2000);
}

// ============================================================
// 16. INITIALIZATION
// ============================================================

function init() {
  recalcViewport();
  generateMap();
  placeCities();

  updateFog();

  G.turn = 0;
  G.phase = 'player';

  for (const unit of G.units) {
    if (unit.faction === FACTION.P1) {
      unit.movesLeft = getEffectiveSpeed(unit);
      unit.moved = false;
    }
  }

  selectNextUnit();
  G.turn = 1;

  // Center on player's city after viewport is calculated
  const p1City = G.cities.find(c => c.faction === FACTION.P1);
  if (p1City) centerViewport(p1City.r, p1City.c);

  resizeCanvas();
  render();
}

window.addEventListener('resize', resizeCanvas);
init();
</script>
